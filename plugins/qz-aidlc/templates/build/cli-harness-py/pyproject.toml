[project]
name = "mockctl"
version = "0.1.0"
description = "__NAME__: an agent-native command line for WireMock-style mock servers, from the QualiZeal AI-DLC Studio's cli-harness starter."
requires-python = ">=3.11,<3.14"
dependencies = ["click==8.3.1"]

[project.scripts]
mockctl = "mockctl.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mockctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
