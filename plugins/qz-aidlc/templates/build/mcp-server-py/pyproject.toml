[project]
name = "qz-mcp-server"
version = "0.1.0"
description = "A read-only MCP server for order lookups, from the QualiZeal AI-DLC Studio starter."
requires-python = ">=3.11,<3.14"
dependencies = ["mcp==2.3.0"]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
