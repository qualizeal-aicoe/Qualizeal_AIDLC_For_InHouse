name: ci
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Python and packages from uv.lock
        run: uv sync --locked --python 3.12
      - name: Tests (offline embedder and reranker, no download)
        run: uv run -m pytest -q tests
      - name: The two models, downloaded once and kept between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/qz-aidlc/models
          key: models-bge-small-en-v1.5-ms-marco-MiniLM-L-6-v2
      - name: Index the corpus with the real embedder
        run: uv run -m arag ingest
      - name: Golden questions and the gate, at the tool, response and outcome levels
        run: uv run -m arag eval --gate
      - name: Live monitoring wiring (the questions just asked, from the audit log, at the tool, response and outcome levels)
        run: uv run -m arag stats --gate
      - name: Hybrid must be at least as good as BM25 alone
        run: uv run -m arag compare --gate
      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          name: eval-results
          path: evals/results/

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t app:ci .
      - name: The gold set inside the container (offline, no key)
        run: docker run --rm --network none app:ci uv run -m arag eval --gate

  vulnerabilities:
    # Go-live gate 7 (vendor review): every lockfile here is checked against the OSV database (osv.dev) on every change,
    # and a known vulnerability fails the build. Open source (Apache-2.0), no account. Results stay in the run: uploading
    # them to code scanning needs GitHub Advanced Security on a private repository.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1
    with:
      upload-sarif: false
      scan-args: |-
        --recursive
        ./
