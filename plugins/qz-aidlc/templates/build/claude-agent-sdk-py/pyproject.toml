[project]
name = "qz-agent"
version = "0.1.0"
description = "A Claude Agent SDK agent from the QualiZeal AI-DLC Studio starter."
requires-python = ">=3.11,<3.14"
dependencies = [
    "claude-agent-sdk==0.2.186",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
