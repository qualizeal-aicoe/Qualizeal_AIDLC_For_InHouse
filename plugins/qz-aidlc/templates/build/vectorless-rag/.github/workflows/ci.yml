name: ci
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Python and packages from uv.lock
        run: uv sync --locked --python 3.12
      - name: Stage tests (later stages skip until built)
        run: uv run -m pytest -q tests
      - name: Index the corpus
        if: hashFiles('vrag/index.py') != ''
        run: uv run -m vrag ingest
      - name: Golden questions and the gate
        if: hashFiles('vrag/evaluate.py') != ''
        run: uv run -m vrag eval --gate
      - name: Live monitoring wiring (the questions just asked, from the audit log, at the tool, response and outcome levels)
        if: hashFiles('vrag/audit.py') != ''
        run: uv run -m vrag stats --gate
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('evals/results/latest.json') != '' && matrix.os == 'ubuntu-latest'
        with:
          name: eval-results
          path: evals/results/latest.json

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        if: hashFiles('vrag/server.py') != ''
        run: docker build -t app:ci .
      - name: The gold set inside the container (offline, no key)
        if: hashFiles('vrag/server.py') != ''
        run: docker run --rm --network none app:ci uv run -m vrag eval --gate

  vulnerabilities:
    # Go-live gate 7 (vendor review): every lockfile here is checked against the OSV database (osv.dev) on every change,
    # and a known vulnerability fails the build. Open source (Apache-2.0), no account. Results stay in the run: uploading
    # them to code scanning needs GitHub Advanced Security on a private repository.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1
    with:
      upload-sarif: false
      scan-args: |-
        --recursive
        ./
