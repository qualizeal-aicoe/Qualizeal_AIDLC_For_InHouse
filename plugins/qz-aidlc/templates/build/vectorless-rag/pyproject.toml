[project]
name = "knowledge-assistant"
version = "0.1.0"
description = "Answers from your own documents with citations, refuses when they do not say, and needs no vector database."
requires-python = ">=3.11,<3.14"
dependencies = [
    "pypdf>=5,<7",          # PDF files only; Markdown, HTML and Word need nothing
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false             # an application: `uv run -m vrag ...`, nothing to build or publish

[tool.pytest.ini_options]
testpaths = ["tests"]
