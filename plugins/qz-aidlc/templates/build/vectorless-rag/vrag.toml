# Settings for the vectorless RAG assistant. Every value has a default in vrag/config.py.

[corpus]
path = "corpus"
manifest = "corpus/manifest.json"   # every document: owner, version, status and who may read it

[index]
path = ".vrag/index.db"             # rebuilt in full by `uv run -m vrag ingest`

[search]
k = 5
weights = [4.0, 2.0, 1.0]           # BM25 weight for section title, heading path, body text
synonyms = ""                       # stage 6: "corpus/synonyms.json" expands question words
include_superseded = false          # answer only from current versions

[answer]
strategy = "bm25"                   # bm25, or tree (stage 6: a model navigates the outline)
min_coverage = 0.6                  # share of the question's words the best sections must contain, or refuse
max_sentences = 3
cache = 256                         # repeat questions answered from memory by the server (a cost lever); 0: off

[guard]
redact = ["phone", "card"]          # personal data removed from answers (stage 4)
mask_at_ingest = ["card", "id"]     # masked before a section is indexed: the index and any model never hold them
blocked_terms = []                  # an answer holding one is withheld (an output check, off until the team lists terms)

[llm]
provider = "none"                   # none, stub (offline, scripted), anthropic (needs ANTHROPIC_API_KEY)
# openai: any OpenAI-compatible server. Open source first: an open-weight model on your own machine,
# for example `ollama pull qwen3:8b`, then provider = "openai" with navigate_model and answer_model = "qwen3:8b".
base_url = "http://localhost:11434/v1"   # openai provider only; a key, if set, goes only to allowed_hosts
allowed_hosts = ["localhost", "127.0.0.1"]
navigate_model = "claude-haiku-5-5"
answer_model = "claude-sonnet-5-5"
max_tokens = 700
timeout_s = 30

# Demo identities. In production the groups come from single sign-on, never from the request.
[users]
employee = ["all"]
manager = ["all", "managers"]
hr = ["all", "hr", "managers"]
finance = ["all", "finance"]

# Who is asking (go-live gate 1; vrag/identity.py). demo: the page picks one of [users], for a laptop demo only.
# oidc: callers send the identity provider's token; proxy: an identity-aware proxy signs people in. Groups come from
# the identity provider on every request (group_map turns its group names into the access groups the manifest uses).
[identity]
mode = "demo"
issuer = ""                         # oidc: the provider's issuer URL
audience = ""                       # oidc: this app's client id or audience
jwks_url = ""                       # oidc: the provider's signing keys (its discovery document names them)
groups_claim = "groups"
trusted_proxies = ["127.0.0.1/32", "::1/128"]   # proxy: the only addresses identity headers are accepted from

[audit]
path = ".vrag/audit.jsonl"
store_question = true

[eval]
golden = "evals/golden.jsonl"
thresholds = "evals/thresholds.json"
results = "evals/results"
