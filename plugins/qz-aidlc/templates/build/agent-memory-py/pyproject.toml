[project]
name = "qz-agent-memory"
version = "0.1.0"
description = "Governed long-term memory for agents, from the QualiZeal AI-DLC Studio starter."
requires-python = ">=3.11,<3.14"
dependencies = [
    "mcp==2.3.0",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
