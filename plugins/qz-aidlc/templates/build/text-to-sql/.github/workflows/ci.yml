name: ci
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Unit tests
        run: uv run -m pytest -q
      - name: The gold set, with its gate (execution accuracy and safety)
        run: uv run -m sqlagent eval --gate
      - name: The gold set through the QualiZeal eval runner, at the tool, response and outcome levels
        shell: bash
        run: uv run -q --no-project --python ">=3.11,<3.14" python -I -X utf8 .claude/qz/scripts/qz.py eval run --label ci
      - name: Live monitoring wiring (the audit lines the gold set just wrote, scored at the same three levels)
        shell: bash
        run: uv run -q --no-project --python ">=3.11,<3.14" python -I -X utf8 .claude/qz/scripts/qz.py eval monitor --log evals/monitor/eval-audit.jsonl --min-runs 1 --require-signal
      - name: Agentic project audit
        shell: bash
        run: uv run -q --no-project --python ">=3.11,<3.14" python -I -X utf8 .claude/qz/scripts/qz.py audit-project scan
      - name: QualiZeal standards (six guardrails, EU AI Act, open source first, cost levers, solution shape, go-live readiness, agent evals)
        shell: bash
        run: uv run -q --no-project --python ">=3.11,<3.14" python -I -X utf8 .claude/qz/scripts/qz.py standards --gate
      - name: Team decisions (docs/decisions/) against this pull request
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        run: uv run -q --no-project --python ">=3.11,<3.14" python -I -X utf8 .claude/qz/scripts/qz.py decisions check --base origin/${{ github.base_ref }} --ci
      - name: Conventions (branch name, merge-request title, the squash commit and its release)
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        run: uv run -q --no-project --python ">=3.11,<3.14" python -I -X utf8 .claude/qz/scripts/qz.py conventions check --base origin/${{ github.base_ref }} --ci --offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qz-reports-${{ matrix.os }}
          path: |
            evals/results/report.html
            .qz/outputs/project-audit/audit.html

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t app:ci .
      - name: The gold set inside the container (offline, no key)
        run: docker run --rm --network none app:ci

  vulnerabilities:
    # Go-live gate 7 (vendor review): every lockfile here is checked against the OSV database (osv.dev) on every change,
    # and a known vulnerability fails the build. Open source (Apache-2.0), no account. Results stay in the run: uploading
    # them to code scanning needs GitHub Advanced Security on a private repository.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1
    with:
      upload-sarif: false
      scan-args: |-
        --recursive
        ./
