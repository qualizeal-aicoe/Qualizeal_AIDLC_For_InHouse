[project]
name = "qz-text-to-sql"
version = "0.1.0"
description = "Ask a database in plain words, read-only, from the QualiZeal AI-DLC Studio starter."
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph==1.2.24",
    "langgraph-checkpoint-sqlite==3.1.3",
    "langchain-anthropic==1.7.12",
    "langchain-openai==1.8.5",
    "sqlglot==30.33.0",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
