name: live-evals
# Runs the gold set against the real model. Started by a person, because it spends money.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
__SETUP_STEPS__
      - name: Gold set against the live model
        env:
__SECRET_ENV__
        run: python3 .claude/qz/scripts/qz.py eval run --config evals/eval.live.json --label live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-eval-results
          path: evals/results-live/
