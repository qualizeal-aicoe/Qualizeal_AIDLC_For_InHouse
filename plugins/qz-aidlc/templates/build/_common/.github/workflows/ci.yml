name: ci
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
__SETUP_STEPS__
      - name: Unit tests
        run: __TEST_CMD__
      - name: Gold set against the offline stub, at the tool, response and outcome levels (no key, no spend)
        run: python3 .claude/qz/scripts/qz.py eval run --label ci
      - name: Live monitoring wiring (the audit lines the gold set just wrote, scored at the same three levels)
        run: python3 .claude/qz/scripts/qz.py eval monitor --log .agent/eval-audit.jsonl --min-runs 1 --require-signal
      - name: Agentic project audit
        run: python3 .claude/qz/scripts/qz.py audit-project scan
      - name: QualiZeal standards (six guardrails, EU AI Act, open source first, cost levers, solution shape, go-live readiness, agent evals)
        run: python3 .claude/qz/scripts/qz.py standards --gate
      - name: Team decisions (docs/decisions/) against this pull request
        if: github.event_name == 'pull_request'
        run: python3 .claude/qz/scripts/qz.py decisions check --base origin/${{ github.base_ref }} --ci
      - name: Conventions (branch name, merge-request title, the squash commit and its release)
        if: github.event_name == 'pull_request'
        run: python3 .claude/qz/scripts/qz.py conventions check --base origin/${{ github.base_ref }} --ci --offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qz-reports
          path: |
            evals/results/report.html
            evals/monitor/latest.json
            .qz/outputs/project-audit/audit.html

  container:
    runs-on: ubuntu-latest
    env:
      UBUNTU_MIRROR: http://azure.archive.ubuntu.com/ubuntu/     # GitHub's runners sit in Azure; an image that installs from Ubuntu uses it
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t app:ci .
      - name: The gold set inside the container (offline, no key)
        run: __CONTAINER_CHECK__
__SERVE_STEP__
  vulnerabilities:
    # Go-live gate 7 (vendor review): every lockfile here is checked against the OSV database (osv.dev) on every change,
    # and a known vulnerability fails the build. Open source (Apache-2.0), no account. Results stay in the run: uploading
    # them to code scanning needs GitHub Advanced Security on a private repository.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1
    with:
      upload-sarif: false
      scan-args: |-
        --recursive
        ./
