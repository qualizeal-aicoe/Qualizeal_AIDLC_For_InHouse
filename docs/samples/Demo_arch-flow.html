<!DOCTYPE html>
<html lang="en" data-theme="story">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Architecture</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* QualiZeal demo design system.
   Two themes on one set of components:
     data-theme="story"   dark navy, editorial serif headlines, glass panels  (product and knowledge demos)
     data-theme="console" light, dense, enterprise dashboard                  (telemetry, ops, agent consoles)
   Brand colours come from assets/brand/tokens.json. Change a client accent with --accent / --brand only. */

:root {
  --qz-blue: #0096FF; --qz-blue-deep: #0A6FD6; --qz-coral: #F43D59; --qz-navy: #0B1F3A;
  --qz-violet: #7B5BFF; --qz-cyan: #22C3E6; --qz-green: #1F9D6B; --qz-amber: #E89B0C; --qz-red: #D2334C;
  --font-sans: 'Inter', 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;
  --font-display: 'Space Grotesk', 'Inter', 'Segoe UI', system-ui, sans-serif;
  --font-serif: 'Instrument Serif', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-xl: 20px; --r-pill: 999px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --nav-h: 60px;
}

[data-theme="story"] {
  --bg: #0A1836; --bg-1: #0E2049; --bg-2: #142A5E; --bg-3: #1B3574;
  --panel: rgba(18, 38, 86, .62); --panel-solid: #112552; --panel-2: rgba(27, 53, 116, .55);
  --border: #24407F; --border-soft: #1A3065; --border-strong: #3A5BB0;
  --text: #EAF0FA; --dim: #B4BFDB; --mute: #98A6C8;
  --brand: var(--qz-blue); --brand-soft: rgba(0, 150, 255, .16); --accent: var(--qz-coral); --accent-soft: rgba(244, 61, 89, .16);
  --ok: #34D399; --ok-soft: rgba(52, 211, 153, .14); --warn: #FBBF24; --warn-soft: rgba(251, 191, 36, .14); --bad: #FB7185; --bad-soft: rgba(251, 113, 133, .14);
  --shadow: 0 10px 40px rgba(0, 0, 0, .45); --glow: 0 0 32px rgba(0, 150, 255, .35);
  --grid-line: rgba(0, 150, 255, .07);
  color-scheme: dark;
}

[data-theme="console"] {
  --bg: #F5F6F9; --bg-1: #FFFFFF; --bg-2: #EEF2F8; --bg-3: #E3E9F2;
  --panel: #FFFFFF; --panel-solid: #FFFFFF; --panel-2: #F7F9FC;
  --border: #E2E7EF; --border-soft: #EDF0F5; --border-strong: #CCD5E3;
  --text: #16243A; --dim: #46556E; --mute: #5E6E86;
  --brand: #0860BD; --brand-soft: #E7F1FD; --accent: #CC2540; --accent-soft: #FDECEF;
  --ok: #17734C; --ok-soft: #E3F5EC; --warn: #8A5A12; --warn-soft: #FDF3DC; --bad: #B92737; --bad-soft: #FCE8EA;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06); --glow: none;
  --grid-line: transparent;
  color-scheme: light;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: var(--font-sans); background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; min-height: 100vh; }
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
[data-theme="story"] :focus-visible { outline-color: #7CC4FF; }
::selection { background: var(--brand); color: #fff; }
input, textarea, select { font: inherit; color: inherit; }
img { max-width: 100%; display: block; }
.mono { font-family: var(--font-mono); }
.dim { color: var(--dim); } .mute { color: var(--mute); } .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
.brand { color: var(--brand); } .accent { color: var(--accent); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.nowrap { white-space: nowrap; } .num { font-variant-numeric: tabular-nums; }

/* ---------- story backdrop ---------- */
html[data-theme="story"] { background: #0A1836; }
.backdrop { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(1200px 700px at 85% -10%, rgba(34, 195, 230, .14), transparent 60%),
    radial-gradient(900px 600px at -10% 30%, rgba(0, 150, 255, .18), transparent 60%),
    radial-gradient(800px 600px at 60% 110%, rgba(244, 61, 89, .14), transparent 60%),
    linear-gradient(180deg, #0B1B3E 0%, #0A1836 45%, #0A1430 100%); }
.texture { position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 28px 28px; mask-image: radial-gradient(ellipse at 50% 30%, #000 30%, transparent 80%); }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: 0; z-index: 50; height: var(--nav-h); display: flex; align-items: center; gap: 18px;
  padding: 0 28px; background: #F8F9FB; color: #16243A; border-bottom: 1px solid #E5E8EE; }
[data-theme="console"] .topbar { background: #fff; }
.topbar .client { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; letter-spacing: -.01em; white-space: nowrap; }
.topbar .client img { height: 30px; width: auto; }
.topbar .divider { width: 1px; height: 32px; background: #DCE1EA; }
.topbar .product { display: flex; flex-direction: column; line-height: 1.15; }
.topbar .product b { font-size: 14px; }
.topbar .product span { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #5B6B82; }
.topbar .product span + span { font-size: 11px; color: #5E6E86; }
.topbar nav { margin-left: auto; display: flex; gap: 22px; font-size: 14px; font-weight: 500; }
.topbar nav a { color: #1A1F36; }
.topbar nav a.on { color: var(--qz-blue-deep); }
.topbar .cta { margin-left: 8px; }

/* ---------- buttons, chips ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: var(--r-md);
  font-weight: 600; font-size: 14px; border: 1px solid var(--border-strong); background: var(--panel-solid); color: var(--text);
  transition: transform .15s var(--ease), box-shadow .2s, background .2s; white-space: nowrap; }
.btn:hover { transform: translateY(-1px); text-decoration: none; }
.btn.primary { background: var(--qz-blue-deep); border-color: transparent; color: #fff; }
.btn.accent { background: linear-gradient(135deg, var(--qz-coral), #C81550); border-color: transparent; color: #fff; }
.btn.grad { background: linear-gradient(135deg, var(--qz-coral) 0%, var(--qz-violet) 60%, var(--qz-blue) 100%); color: #fff; border: 0; }
.btn.ghost { background: transparent; }
.btn.sm { height: 30px; padding: 0 11px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: var(--r-pill);
  font-size: 12px; font-weight: 600; background: var(--bg-2); color: var(--dim); border: 1px solid var(--border-soft); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.info { background: var(--brand-soft); color: var(--brand); border-color: transparent; }
.chip.violet { background: rgba(123, 91, 255, .14); color: #5B3FD9; border-color: transparent; }
[data-theme="story"] .chip.violet { color: #B9A8FF; }
.chip.mono, .tag { font-family: var(--font-mono); font-weight: 500; letter-spacing: .02em; }
.tag { font-size: 11px; text-transform: uppercase; color: var(--mute); letter-spacing: .08em; }
.src { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 5px;
  background: var(--bg-2); color: var(--dim); white-space: nowrap; flex: none; }
.src.otel { background: rgba(123, 91, 255, .13); color: #5B3FD9; } .src.github { background: var(--brand-soft); color: var(--brand); }
.src.jira { background: rgba(34, 195, 230, .14); color: #007399; } .src.kf { background: var(--accent-soft); color: var(--accent); }
.live { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, .6); } 70% { box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); } 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); } }
.statusbar { display: inline-flex; align-items: center; gap: 12px; padding: 8px 16px; border-radius: var(--r-pill);
  background: var(--panel); border: 1px solid var(--border); font-family: var(--font-mono); font-size: 13px; color: var(--dim); backdrop-filter: blur(10px); }
.statusbar .chip { height: 20px; font-size: 11px; }

/* ---------- type ---------- */
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
[data-theme="console"] .eyebrow { color: var(--mute); letter-spacing: .12em; }
[data-theme="story"] .eyebrow { color: #FF6B81; }
.display { font-family: var(--font-serif); font-weight: 400; font-size: clamp(44px, 6.2vw, 84px); line-height: 1.02; letter-spacing: -.02em; }
.display em, .h1 em, .h2 em { font-style: italic; color: #FF6B81; padding-right: .06em; }
[data-theme="console"] :is(.display, .h1, .h2) em { color: var(--accent); }
.h1 { font-family: var(--font-serif); font-weight: 400; font-size: clamp(34px, 4vw, 52px); line-height: 1.08; letter-spacing: -.015em; }
[data-theme="console"] .h1 { font-family: var(--font-sans); font-weight: 700; font-size: 28px; letter-spacing: -.02em; }
.h2 { font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: -.01em; line-height: 1.25; }
.h3 { font-weight: 650; font-size: 16px; line-height: 1.35; }
.lede { font-size: 18px; color: var(--dim); max-width: 62ch; line-height: 1.6; }
.small { font-size: 13px; } .xs { font-size: 12px; }

/* ---------- layout ---------- */
.wrap { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; padding: 0 32px; }
.section { position: relative; z-index: 1; padding: 96px 0; border-top: 1px solid var(--border-soft); }
.section-head { margin-bottom: 36px; display: grid; gap: 12px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } .g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.row { display: flex; align-items: center; gap: 10px; } .row.between { justify-content: space-between; } .row.wrap-ok { flex-wrap: wrap; }
.stack { display: grid; gap: 10px; } .stack.lg { gap: 18px; }
.spacer { flex: 1; }

/* ---------- panels ---------- */
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow); }
[data-theme="story"] .panel { background: var(--panel-solid); }
.panel.pad, .pad { padding: 20px 22px; }
.panel.tight { padding: 14px 16px; }
.panel.hl { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.panel-head .h3 + .small { margin-top: 2px; }
.rule { height: 1px; background: var(--border-soft); margin: 14px 0; }
.callout { display: grid; grid-template-columns: 4px 1fr; gap: 14px; padding: 14px 18px; border-radius: var(--r-md); background: var(--brand-soft); }
.callout::before { content: ""; border-radius: 4px; background: var(--brand); }
.callout.warn { background: var(--warn-soft); } .callout.warn::before { background: var(--warn); }
.callout.ok { background: var(--ok-soft); } .callout.ok::before { background: var(--ok); }
.callout.bad { background: var(--bad-soft); } .callout.bad::before { background: var(--bad); }
.callout b { display: block; margin-bottom: 2px; }

/* ---------- KPI tiles ---------- */
.kpi { padding: 16px 18px 12px; display: grid; gap: 4px; min-height: 150px; }
.kpi .top { display: flex; justify-content: space-between; align-items: center; }
.kpi .label { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--dim); }
.kpi .value { font-size: 32px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
[data-theme="story"] .kpi .value { font-family: var(--font-serif); font-weight: 400; font-size: 44px; }
.kpi .value small { font-size: 14px; font-weight: 500; color: var(--dim); margin-left: 4px; letter-spacing: 0; font-family: var(--font-sans); }
.kpi .meta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--mute); }
.delta { font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 6px; font-variant-numeric: tabular-nums; }
.delta.good { background: var(--ok-soft); color: var(--ok); } .delta.bad { background: var(--bad-soft); color: var(--bad); } .delta.flat { background: var(--bg-2); color: var(--dim); }
.kpi svg.spark { width: 100%; height: 40px; margin-top: 6px; overflow: visible; }
.stat { display: grid; gap: 4px; }
.stat .n { font-family: var(--font-serif); font-size: 46px; line-height: 1; letter-spacing: -.02em; }
[data-theme="console"] .stat .n { font-family: var(--font-sans); font-weight: 700; font-size: 34px; }
.stat .l { font-size: 13px; color: var(--dim); }

/* ---------- meters, bars ---------- */
.meter { height: 6px; border-radius: 6px; background: var(--bg-3); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 6px; background: var(--brand); width: 0; transition: width 1s var(--ease); }
.meter.grad > i { background: linear-gradient(90deg, var(--qz-blue), var(--qz-cyan)); }
.meter.warm > i { background: linear-gradient(90deg, var(--qz-amber), var(--qz-coral)); }
.meter.ok > i { background: var(--ok); } .meter.warn > i { background: var(--warn); } .meter.bad > i { background: var(--bad); }
.mrow { display: grid; grid-template-columns: 130px 1fr 52px; gap: 12px; align-items: center; font-size: 13px; }
.mrow b { text-align: right; font-variant-numeric: tabular-nums; }
.hbar { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.4fr); gap: 14px; align-items: center; font-size: 13px; padding: 5px 0; }
.hbar .bar { height: 22px; border-radius: 5px; background: linear-gradient(90deg, var(--brand), color-mix(in srgb, var(--brand) 60%, var(--qz-violet)));
  color: #fff; font-size: 11px; font-family: var(--font-mono); display: flex; align-items: center; justify-content: flex-end; padding: 0 8px; min-width: 34px;
  transform-origin: left; animation: grow .9s var(--ease) both; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.segbar { display: flex; height: 30px; border-radius: 8px; overflow: hidden; font-size: 12px; font-weight: 700; color: #fff; }
.segbar > div { display: flex; align-items: center; justify-content: center; white-space: nowrap; overflow: hidden; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--dim); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.ring { position: relative; display: grid; place-items: center; }
.ring svg { transform: rotate(-90deg); }
.ring .ring-n { position: absolute; text-align: center; }
.ring .ring-n b { font-family: var(--font-serif); font-size: 52px; font-weight: 400; line-height: 1; display: block; }

/* ---------- tables ---------- */
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { text-align: left; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.table td { padding: 11px 12px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.table td.r, .table th.r { text-align: right; font-variant-numeric: tabular-nums; }
.table tbody tr { transition: background .15s; } .table tbody tr:hover { background: var(--panel-2); }

/* ---------- feed ---------- */
.feed { display: grid; gap: 2px; }
.feed .item { display: grid; grid-template-columns: 62px 1fr; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--border-soft); font-size: 13px; animation: slidein .5s var(--ease) both; }
.feed .item:last-child { border-bottom: 0; }
.feed .when { font-size: 12px; color: var(--mute); margin-top: 2px; }
@keyframes slidein { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

/* ---------- segmented control, tabs ---------- */
.seg { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.seg button { height: 32px; padding: 0 14px; border-radius: var(--r-pill); border: 1px solid var(--border-strong); background: var(--panel-solid); font-size: 13px; font-weight: 500; }
.seg button.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.tabs { display: flex; gap: 4px; padding: 4px; border-radius: var(--r-md); background: var(--bg-2); width: max-content; }
.tabs button { padding: 6px 14px; border-radius: 8px; font-size: 13px; color: var(--dim); }
.tabs button.on { background: var(--panel-solid); color: var(--text); box-shadow: var(--shadow); }
[data-theme="story"] .tabs button.on { background: var(--accent-soft); color: var(--text); box-shadow: inset 0 0 0 1px var(--accent); }

/* ---------- stepper (stage tracker) ---------- */
.stepper { display: grid; gap: 2px; }
.step { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 9px; font-size: 14px; color: var(--dim); }
.step .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border-strong); display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.step.done { color: var(--text); } .step.done .dot { background: var(--ok); border-color: var(--ok); color: #fff; }
.step.now { color: var(--text); background: var(--brand-soft); } .step.now .dot { border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
.step.gated .dot { border-color: var(--warn); color: var(--warn); }

/* ---------- gate card ---------- */
.gate { border: 1px solid var(--warn); background: var(--warn-soft); border-radius: var(--r-md); padding: 14px 16px; display: grid; gap: 10px; animation: slidein .4s var(--ease) both; }
.gate .row .btn { height: 32px; }

/* ---------- section dot nav ---------- */
.dotnav { position: fixed; right: 22px; top: 50%; transform: translateY(-50%); display: grid; gap: 10px; z-index: 40; }
.dotnav a { width: 16px; height: 8px; border-radius: 8px; background: var(--border-strong); transition: all .3s var(--ease); }
.dotnav a.on { width: 22px; background: var(--accent); box-shadow: 0 0 12px var(--accent); }

/* ---------- reveal ---------- */
.reveal { opacity: 0; transform: translateY(18px); transition: opacity .8s var(--ease), transform .8s var(--ease); }
.reveal.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } * { animation-duration: .01ms !important; } }

/* ---------- console shell ---------- */
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: calc(100vh - var(--nav-h)); background: linear-gradient(90deg, var(--bg-1) 248px, transparent 248px); }
.shell > .side { border-right: 0; box-shadow: inset -1px 0 0 var(--border); }
.side { border-right: 1px solid var(--border); background: var(--bg-1); padding: 18px 0; position: sticky; top: var(--nav-h); height: calc(100vh - var(--nav-h)); overflow: auto; }
.side .grp { padding: 14px 20px 6px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); font-weight: 700; }
.side a { display: flex; justify-content: space-between; align-items: center; padding: 9px 20px; color: var(--text); font-size: 14px; border-left: 3px solid transparent; }
.side a:hover { background: var(--bg-2); text-decoration: none; }
.side a.on { background: var(--brand-soft); color: var(--brand); border-left-color: var(--brand); font-weight: 600; }
.main { padding: 26px 32px 60px; min-width: 0; }
.pagehead { display: grid; gap: 6px; margin-bottom: 18px; }
.toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }

/* ---------- footer, toast, modal ---------- */
.foot { position: relative; z-index: 1; padding: 28px 0 40px; border-top: 1px solid var(--border-soft); font-family: var(--font-mono); font-size: 12px; color: var(--mute); }
.foot .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.demo-by { display: inline-flex; align-items: center; gap: 8px; }
.demo-by img { height: 18px; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0; z-index: 90; padding: 10px 18px; border-radius: var(--r-md);
  background: var(--qz-navy); color: #fff; font-size: 14px; box-shadow: var(--shadow); transition: all .3s var(--ease); pointer-events: none; }
.toast.in { opacity: 1; transform: translateX(-50%); }
.modal { position: fixed; inset: 0; z-index: 80; display: none; place-items: center; background: rgba(6, 12, 28, .55); backdrop-filter: blur(4px); padding: 24px; }
.modal.in { display: grid; }
.modal > .panel { width: min(760px, 100%); max-height: 84vh; overflow: auto; background: var(--panel-solid); }
.drawer { position: fixed; top: var(--nav-h); right: 0; bottom: 0; width: min(520px, 92vw); z-index: 70; background: var(--panel-solid); border-left: 1px solid var(--border);
  box-shadow: var(--shadow); transform: translateX(100%); transition: transform .35s var(--ease); overflow: auto; padding: 22px; }
.drawer.in { transform: none; }
pre.code { font-family: var(--font-mono); font-size: 13px; line-height: 1.6; background: var(--bg-2); border-radius: var(--r-md); padding: 14px 16px; overflow: auto; white-space: pre-wrap; }
pre.code .add { color: var(--ok); } pre.code .del { color: var(--bad); }
mark.hit { background: var(--warn-soft); color: inherit; border-radius: 3px; padding: 0 2px; }
.cite { display: inline-grid; place-items: center; min-width: 22px; height: 18px; padding: 0 5px; margin: 0 2px; border-radius: 5px; font-family: var(--font-mono);
  font-size: 11px; font-weight: 700; background: var(--warn-soft); color: var(--warn); vertical-align: 2px; cursor: pointer; }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .g4, .g5 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .split { grid-template-columns: 1fr; }
  .topbar nav { display: none; }
}
@media (max-width: 760px) {
  [data-theme="story"] :is(.xs, .tag, .chip, .src, .eyebrow, .mono, small, .statusbar .chip, .hbar .bar) { font-size: 12px; }

  .wrap { padding: 0 18px; } .section { padding: 64px 0; }
  .g2, .g3, .g4, .g5 { grid-template-columns: 1fr; }

  .topbar { padding: 0 16px; gap: 10px; } .topbar .product, .topbar .divider { display: none; }

<script>
/* QualiZeal demo helpers: DOM, formatting, seeded data, small SVG charts, motion. No dependencies. */
(function () {
  "use strict";
  const QZ = {};

  // ---------- DOM ----------
  QZ.$ = (s, r) => (r || document).querySelector(s);
  QZ.$$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  QZ.h = function (tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "html") el.innerHTML = v;
      else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(String(k)));
    return el;
  };
  QZ.esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---------- formatting ----------
  QZ.fmt = {
    n: (v, d = 0) => Number(v).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }),
    pct: (v, d = 1) => `${(v * 100).toFixed(d)}%`,
    money: (v, cur = "$") => cur + Number(v).toLocaleString("en-US", { maximumFractionDigits: 0 }),
    compact: (v) => Intl.NumberFormat("en-US", { notation: "compact", maximumFractionDigits: 1 }).format(v),
    dur: (h) => (h >= 24 ? `${(h / 24).toFixed(1)}d` : h >= 1 ? `${h.toFixed(1)}h` : `${Math.round(h * 60)}m`),
    signed: (v, d = 1, unit = "") => `${v > 0 ? "+" : v < 0 ? "−" : "±"}${Math.abs(v).toFixed(d)}${unit}`,
    ago: (sec) => (sec < 60 ? `${Math.round(sec)}s ago` : sec < 3600 ? `${Math.floor(sec / 60)}m ${Math.round(sec % 60)}s ago` : `${Math.floor(sec / 3600)}h ago`),
  };

  // ---------- seeded data: the same seed always gives the same believable numbers ----------
  QZ.rng = function (seed) {
    let a = typeof seed === "number" ? seed : [...String(seed)].reduce((h, c) => (Math.imul(h ^ c.charCodeAt(0), 2654435761) >>> 0), 2166136261);
    return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  /** A series that wanders like real telemetry: trend + weekly rhythm + noise, clamped. */
  QZ.series = function (seed, n, { base = 50, vol = 0.08, trend = 0, weekly = 0, min = -Infinity, max = Infinity, round = 1 } = {}) {
    const r = QZ.rng(seed); const out = []; let v = base;
    for (let i = 0; i < n; i++) {
      v = v * (1 + (r() - 0.5) * vol) + trend * base / n;
      const w = weekly ? Math.sin((i / 7) * 2 * Math.PI) * weekly * base : 0;
      const x = Math.min(max, Math.max(min, v + w));
      out.push(Math.round(x / round) * round);
    }
    return out;
  };
  QZ.pick = (r, arr) => arr[Math.floor(r() * arr.length)];

  // ---------- SVG charts ----------
  QZ.spark = function (vals, { w = 240, h = 40, color = "var(--brand)", fill = true, dot = true } = {}) {
    if (!vals.length) return "";
    const mn = Math.min(...vals), mx = Math.max(...vals), sp = mx - mn || 1;
    const pts = vals.map((v, i) => [(i / (vals.length - 1 || 1)) * w, h - 3 - ((v - mn) / sp) * (h - 8)]);
    const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    const id = "g" + Math.random().toString(36).slice(2, 8);
    const last = pts[pts.length - 1];
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
      ${fill ? `<path d="${d} L ${w} ${h} L 0 ${h} Z" fill="url(#${id})"/>` : ""}
      <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      ${dot ? `<circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${color}"/>` : ""}</svg>`;
  };
  /** Stacked columns: series = [{name, color, values[]}], labels[] */
  QZ.stack = function (series, labels, { w = 640, h = 200, pad = 26, max } = {}) {
    const n = labels.length, tot = labels.map((_, i) => series.reduce((s, x) => s + x.values[i], 0));
    const top = max || Math.max(...tot) * 1.08, bw = (w - pad) / n;
    let out = `<svg viewBox="0 0 ${w} ${h + 18}" style="width:100%;height:auto">`;
    for (const g of [0, 0.5, 1]) { const y = h - g * h; out += `<line x1="${pad}" x2="${w}" y1="${y}" y2="${y}" stroke="var(--border-soft)"/><text x="0" y="${y + 4}" font-size="10" fill="var(--mute)">${Math.round(g * top)}</text>`; }
    labels.forEach((lb, i) => {
      let y = h; const x = pad + i * bw + bw * 0.15;
      series.forEach((s) => { const bh = (s.values[i] / top) * h; y -= bh; out += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw * 0.7).toFixed(1)}" height="${Math.max(0, bh).toFixed(1)}" rx="2" fill="${s.color}"><title>${s.name}: ${s.values[i]}</title></rect>`; });
      out += `<text x="${(x + bw * 0.35).toFixed(1)}" y="${h + 14}" font-size="10" text-anchor="middle" fill="var(--mute)">${lb}</text>`;
    });
    return out + "</svg>";
  };
  QZ.ring = function (value, { size = 168, stroke = 14, color = "var(--ok)", track = "var(--bg-3)" } = {}) {
    const r = (size - stroke) / 2, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(1, value)));
    return `<svg width="${size}" height="${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}">
      <animate attributeName="stroke-dashoffset" from="${c}" to="${off}" dur="1.2s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1"/></circle></svg>`;
  };

  // ---------- motion ----------
  QZ.countUp = function (el, to, { ms = 900, d = 0, suffix = "" } = {}) {
    const t0 = performance.now();
    (function tick(t) { const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3); el.textContent = QZ.fmt.n(to * e, d) + suffix; if (k < 1) requestAnimationFrame(tick); })(t0);
  };
  QZ.reveal = function (root) {
    const els = QZ.$$(".reveal", root);
    if (!("IntersectionObserver" in window)) { els.forEach((e) => e.classList.add("in")); return; }
    const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: 0.12 });
    els.forEach((e) => io.observe(e));
  };
  QZ.dotnav = function (nav) {
    const links = QZ.$$("a", nav), secs = links.map((a) => QZ.$(a.getAttribute("href")));
    const on = () => { let k = 0; secs.forEach((s, i) => { if (s && s.getBoundingClientRect().top < innerHeight * 0.45) k = i; }); links.forEach((a, i) => a.classList.toggle("on", i === k)); };
    addEventListener("scroll", on, { passive: true }); on();
  };
  QZ.tabs = function (root, onChange) {
    QZ.$$("button", root).forEach((b) => b.addEventListener("click", () => { QZ.$$("button", root).forEach((x) => x.classList.toggle("on", x === b)); onChange && onChange(b.dataset.tab); }));
  };
  let toastT;
  QZ.toast = function (msg) {
    let t = QZ.$(".toast"); if (!t) { t = QZ.h("div", { class: "toast" }); document.body.append(t); }
    t.textContent = msg; t.classList.add("in"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("in"), 2600);
  };
  /** Hash routing that works inside a hosted artifact frame: plain #name only. */
  QZ.route = function (views, start, onShow) {
    const show = () => { const k = (location.hash || "#" + start).slice(1); const key = views.includes(k) ? k : start; onShow(key); };
    addEventListener("hashchange", show); show();
  };
  QZ.store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
               set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage may be unavailable */ } } };

  // ---------- branding ----------
  /** brand = {client, clientLogo (data URI, supplied by the person), product, tagline, qzMark (data URI)} */
  QZ.brand = function (brand) {
    if (!brand) return;
    QZ.$$("[data-brand]").forEach((el) => { const k = el.dataset.brand; if (brand[k] != null) el.textContent = brand[k]; });
    QZ.$$("[data-brand-logo]").forEach((el) => {
      const k = el.dataset.brandLogo;
      if (brand[k]) { el.innerHTML = ""; el.append(QZ.h("img", { src: brand[k], alt: brand.client || "" })); }
    });
    if (brand.accent) document.documentElement.style.setProperty("--accent", brand.accent);
    if (brand.title) document.title = brand.title;
  };

  window.QZ = QZ;
})();

</script>

      el("rect", { x, y: top, width: SIDE, height: bot - top, rx: 16, fill: "rgba(123,91,255,.10)", stroke: "#5B47C9", "stroke-dasharray": "6 6" });
      el("text", { x: x + 18, y: top + 32, fill: "#C9BCFF", "font-family": "JetBrains Mono, monospace", "font-size": 11, "letter-spacing": "1.5" }).textContent = A.side.title.toUpperCase();
      A.side.items.forEach((t, k) => { const yy = top + 64 + k * 46;
        el("rect", { x: x + 14, y: yy - 20, width: SIDE - 28, height: 34, rx: 8, fill: "rgba(14,32,73,.8)", stroke: "#2B3F7E" });
        el("text", { x: x + 26, y: yy + 2, fill: "#DCE3F5", "font-family": "Inter, sans-serif", "font-size": 12.5 }).textContent = t; });
    }
    const flowsG = el("g", {}), nodesG = el("g", {});
    A.flows.forEach((f, k) => {
      const a = pos[f.from], b = pos[f.to]; if (!a || !b) return;
      let d, lx, ly;
      if (a.li === b.li) { const x1 = a.x + a.w / 2, x2 = b.x + b.w / 2, yt = a.y - 13; d = `M${x1} ${a.y} L${x1} ${yt} L${x2} ${yt} L${x2} ${b.y}`; lx = (x1 + x2) / 2; ly = yt - 3; }
      else { const down = b.li > a.li, x1 = a.x + a.w / 2 + ((k % 3) - 1) * 14, y1 = down ? a.y + a.h : a.y, x2 = b.x + b.w / 2 + ((k % 3) - 1) * 14, y2 = down ? b.y : b.y + b.h, my = (y1 + y2) / 2 + ((k % 2) * 10 - 5);
        d = `M${x1} ${y1} L${x1} ${my} L${x2} ${my} L${x2} ${y2}`; lx = (x1 + x2) / 2; ly = my - 6; }
      const tone = f.tone || "def", col = TONE[f.tone] || "#7FA8FF";
      const p = el("path", { d, class: "flow", stroke: col, "marker-end": `url(#ar-${tone})`, "data-k": k }, flowsG);
      const dot = el("circle", { r: 3.6, fill: "#fff", class: "pulse", "data-k": k }, flowsG);
      const am = el("animateMotion", { dur: "2.2s", repeatCount: "indefinite", path: d, begin: `${(k % 5) * 0.35}s` }, dot);
      if (f.label) { const t = el("text", { x: lx, y: ly, "text-anchor": "middle", class: "flabel", "data-k": k }, flowsG); t.textContent = f.label; }
      f._p = p; f._dot = dot; f._am = am;
    });
    Object.values(pos).forEach(({ x, y, w, h, nd }) => {
      const g = el("g", { class: "node", "data-id": nd.id }, nodesG);
      el("rect", { class: "box", x, y, width: w, height: h, rx: 12, fill: nd.added ? "rgba(244,61,89,.07)" : "#112552", stroke: nd.added ? "#F43D59" : "#3A5BB0", "stroke-dasharray": nd.added ? "6 5" : "0", "stroke-width": 1.4 }, g);
      el("rect", { x: x + 12, y: y + 17, width: 42, height: 42, rx: 10, fill: nd.added ? "rgba(244,61,89,.18)" : "rgba(0,150,255,.16)" }, g);
      const ic = window.QZ_ICONS && QZ_ICONS[nd.icon];
      if (ic) { const s = el("svg", { x: x + 21, y: y + 26, width: 24, height: 24, viewBox: "0 0 24 24", fill: "none", stroke: nd.added ? "#FF8BA0" : "#7FC4FF", "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round" }, g); s.innerHTML = ic; }
      el("text", { x: x + 66, y: y + 33, fill: "#EAF0FA", "font-family": "Inter, sans-serif", "font-size": 14.5, "font-weight": 650 }, g).textContent = nd.label;
      const sub = el("text", { x: x + 66, y: y + 53, fill: "#A9B5D3", "font-family": "Inter, sans-serif", "font-size": 11.5 }, g);
      wrap(sub, nd.sub || "", w - 78);
      if (nd.badge) { el("circle", { cx: x + w - 14, cy: y + 14, r: 11, fill: "#F43D59" }, g); el("text", { x: x + w - 14, y: y + 18, "text-anchor": "middle", fill: "#fff", "font-size": 11, "font-weight": 700, "font-family": "Inter" }, g).textContent = nd.badge; }
      if (nd.added) el("text", { x: x + w - 10, y: y + h - 9, "text-anchor": "end", fill: "#FF8BA0", "font-family": "JetBrains Mono, monospace", "font-size": 9.5, "letter-spacing": "1" }, g).textContent = "ADDED";
    });
  }
  function wrap(t, s, max) {
    const words = s.split(" "); let line = "", dy = 0, first = true;
    const ts = () => { const sp = document.createElementNS(NS, "tspan"); sp.setAttribute("x", t.getAttribute("x")); sp.setAttribute("dy", first ? 0 : 14); first = false; t.append(sp); return sp; };
    let sp = ts();
    words.forEach((w) => { sp.textContent = line ? line + " " + w : w; if (sp.getComputedTextLength && sp.getComputedTextLength() > max && line) { sp.textContent = line; sp = ts(); line = w; sp.textContent = w; dy++; } else line = sp.textContent; });
  }

  let step = 0, auto = true, tmr;
  function show(k) {
    step = (k + A.steps.length) % A.steps.length;
    const S = A.steps[step], on = new Set(S.flows), nodes = new Set(S.flows.flatMap((i) => [A.flows[i].from, A.flows[i].to]));
    A.flows.forEach((f, i) => { const v = on.has(i); f._p.classList.toggle("dim", !v); f._p.classList.toggle("on", v); f._dot.classList.toggle("dim", !v); svg.querySelector(`.flabel[data-k="${i}"]`)?.classList.toggle("dim", !v); });
    svg.querySelectorAll(".node").forEach((g) => { const v = nodes.has(g.dataset.id); g.classList.toggle("on", v); g.classList.toggle("dim", !v); });
    $("#cap-n").textContent = String(step + 1).padStart(2, "0"); $("#cap-t").textContent = S.title; $("#cap-c").textContent = S.caption; $("#cap-k").textContent = `step ${step + 1} of ${A.steps.length}`;
  }
  function showAll() { auto = false; clearInterval(tmr); $("#playb").textContent = "▶ Play"; A.flows.forEach((f, i) => { f._p.classList.remove("dim", "on"); f._dot.classList.remove("dim"); svg.querySelector(`.flabel[data-k="${i}"]`)?.classList.remove("dim"); });
    svg.querySelectorAll(".node").forEach((g) => g.classList.remove("on", "dim")); $("#cap-n").textContent = "∞"; $("#cap-t").textContent = "The whole flow"; $("#cap-c").textContent = A.subtitle; $("#cap-k").textContent = `${A.flows.length} flows`; }
  const play = () => { clearInterval(tmr); tmr = setInterval(() => show(step + 1), window.QZ_STEP_MS || A.stepMs || 3600); };

  QZ.brand(A.brand);
  $("#eyebrow").textContent = A.eyebrow; $("#title").textContent = A.title; $("#sub").textContent = A.subtitle;
  draw();
  if (A.steps && A.steps.length) { show(0); play(); } else showAll();
  $("#next").onclick = () => { show(step + 1); if (auto) play(); };
  $("#prev").onclick = () => { show(step - 1); if (auto) play(); };
  $("#playb").onclick = () => { auto = !auto; $("#playb").textContent = auto ? "❚❚ Pause" : "▶ Play"; if (auto) { show(step); play(); } else clearInterval(tmr); };
  $("#all").onclick = showAll;
  window.QZ_ARCH_STEP = show;
})();

</script>
</body>
